<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#071428">
		<title>Money Up — Pitching Pennies N16</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	color: #ffffff;
	background: radial-gradient(circle at 50% 25%, #122c54 0%, #071428 75%);
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	background: radial-gradient(circle at 50% 28%, #153566 0%, #071428 75%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	padding: 24px;
	box-sizing: border-box;
	visibility: hidden;
	z-index: 10;
}

#status-splash {
	width: 120px;
	height: 120px;
	border-radius: 26px;
	border: 3px solid #ffd44d;
	box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
	object-fit: cover;
}

#status-splash.show-image--false {
	display: none;
}

#status-title {
	font-size: 28px;
	font-weight: 900;
	letter-spacing: 1px;
	color: #ffd44d;
	text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
	text-align: center;
}

#status-sub {
	font-size: 14px;
	font-weight: 700;
	letter-spacing: 1.4px;
	color: #8fd3ff;
	text-transform: uppercase;
	text-align: center;
	margin-top: -10px;
}

#status-progress {
	display: none;
	width: min(320px, 78vw);
	height: 14px;
	appearance: none;
	-webkit-appearance: none;
	border-radius: 999px;
	overflow: hidden;
	border: 2px solid #2b67b5;
	background: #061124;
}

#status-progress::-webkit-progress-bar {
	background: #061124;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #ffbe1a, #ffe269);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #ffbe1a, #ffe269);
}

#status-notice {
	display: none;
	max-width: 420px;
	background-color: #4f1d28;
	border-radius: 14px;
	border: 2px solid #d6495c;
	color: #f4f6fb;
	line-height: 1.4;
	padding: 14px 18px;
	text-align: center;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the HTML5 canvas tag.
		</canvas>

		<noscript>
			JavaScript is required to play Money Up.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="Money Up">
			<div id="status-title">MONEY UP</div>
			<div id="status-sub">Pitching Pennies • Chaucer Court N16</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":35409052,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred while loading Money Up.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Money Up in this browser are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
